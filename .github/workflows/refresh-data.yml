name: Refresh Cloudflare D1 data

on:
  repository_dispatch:
    types:
      - freecreds-cvc-refresh
      - freecreds-assist-refresh
  workflow_dispatch:
    inputs:
      job:
        description: "Refresh job to run"
        required: true
        default: cvc
        type: choice
        options:
          - cvc
          - assist

permissions:
  contents: read

env:
  D1_DATABASE_NAME: freecreds-db

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select refresh job
        id: refresh
        shell: bash
        run: |
          KIND="${{ github.event.client_payload.kind || inputs.job }}"
          if [[ -z "$KIND" ]]; then
            case "${{ github.event.action }}" in
              freecreds-cvc-refresh) KIND="cvc" ;;
              freecreds-assist-refresh) KIND="assist" ;;
            esac
          fi
          if [[ "$KIND" != "cvc" && "$KIND" != "assist" ]]; then
            echo "Unsupported refresh kind: $KIND" >&2
            exit 1
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "job_id=${{ github.event.client_payload.job_id }}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm ci

      - name: Reset local SQLite workspace
        shell: bash
        run: |
          mkdir -p data
          rm -f data/assist.db data/assist.db-wal data/assist.db-shm data/assist.db-journal

      - name: Determine CVC terms
        id: terms
        shell: bash
        run: |
          TERMS="$(python - <<'PY'
          from datetime import date
          from src.terms import upcoming_terms
          print(",".join(t.code for t in upcoming_terms(date.today(), count=4)))
          PY
          )"
          echo "codes=$TERMS" >> "$GITHUB_OUTPUT"

      - name: Restore CVC seed database
        if: steps.refresh.outputs.kind == 'cvc'
        run: node scripts/restore-cvc-seed.mjs seed/cvc-base.sql.gz data/assist.db

      - name: Refresh ASSIST articulations
        if: steps.refresh.outputs.kind == 'assist'
        run: python -m src.ingester --all

      - name: Refresh CVC offerings
        if: steps.refresh.outputs.kind == 'cvc' || steps.refresh.outputs.kind == 'assist'
        run: python -m src.cvc_fetcher --terms "${{ steps.terms.outputs.codes }}"

      - name: Apply schedule URLs and seed upcoming terms
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          from src import db
          from src.schedule_urls import apply_schedule_urls
          from src.terms import upcoming_terms

          conn = db.connect(Path("data/assist.db"))
          try:
              db.init_db(conn)
              apply_schedule_urls(conn)
              for term in upcoming_terms(date.today(), count=4):
                  db.upsert_term(
                      conn,
                      code=term.code,
                      label=term.label,
                      season=term.season,
                      year=term.year,
                  )
              conn.commit()
          finally:
              conn.close()
          PY

      - name: Import CVC offerings into D1
        if: steps.refresh.outputs.kind == 'cvc'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/dump-cvc-for-d1.mjs data/assist.db d1_cvc_import "${{ steps.terms.outputs.codes }}"
          node scripts/import-d1-chunks.mjs d1_cvc_import "$D1_DATABASE_NAME"

      - name: Import full ASSIST data into D1
        if: steps.refresh.outputs.kind == 'assist'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/dump-sqlite-for-d1.mjs data/assist.db d1_import
          node scripts/import-d1-chunks.mjs d1_import "$D1_DATABASE_NAME"

      - name: Mark ingest job completed
        if: steps.refresh.outputs.job_id != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          NOW="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          JOB_ID="${{ steps.refresh.outputs.job_id }}"
          printf "UPDATE ingest_jobs SET status = 'completed', finished_at = '%s' WHERE id = '%s';\n" "$NOW" "$JOB_ID" > job_done.sql
          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --file job_done.sql --yes
