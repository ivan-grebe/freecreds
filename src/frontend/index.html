  <script>
    // Apply stored theme before first paint to avoid flash. If no stored
    // preference, let the media query below decide at render time.
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
        var effective = (t === "light" || t === "dark")
          ? t
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-effective-theme", effective);
      } catch (e) {}
    })();
  </script>

    }
    .combo-item.active { background: var(--hover-bg); }

    button {

      border: 0; border-radius: 10px; font: inherit; font-weight: 750; cursor: pointer;

    table { width: 100%; border-collapse: collapse; background: var(--panel);

    details { margin-top: 1.5rem; background: var(--panel); border: 0;
              border-radius: 14px; padding: .75rem 1rem; box-shadow: var(--shadow-border); }
    details summary { min-height: 40px; display: flex; align-items: center; cursor: pointer; color: var(--muted); font-size: 14px; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details summary::after {
      content: "›";
      margin-left: auto;
      font-size: 20px;
      line-height: 1;
      transform: rotate(0deg);
      transition: transform 160ms var(--ease-out);
    }
    details[open] summary::after { transform: rotate(90deg); }
    .no-art-list { margin-top: .5rem; font-size: 13px; }
    .no-art-item { color: var(--muted); padding: .2rem 0; }
    .error { padding: 1rem; background: var(--error-bg); border: 1px solid var(--error-line); color: var(--warn);
             border-radius: 12px; }

    .spinner {

    @keyframes spin { to { transform: rotate(360deg); } }
    .enter-item, .enter-result-summary {
      opacity: 0;
      transform: translateY(8px);
      animation: enter-up var(--duration-enter) var(--ease-out) forwards;
    }
    .enter-1 { animation-delay: 0ms; }
    .enter-2 { animation-delay: 30ms; }
    .enter-3 { animation-delay: 60ms; }
    @keyframes enter-up { to { opacity: 1; transform: translateY(0); } }

    @media (min-width: 721px) {

    @media (hover: hover) and (pointer: fine) {

    }

<body>
<main>
  <div class="page-head enter-item enter-1">
    <div>
      <h1>FreeCreds</h1>
      <p class="lede">Find California community college courses that transfer for the university class you need.</p>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
      <span class="theme-icons" aria-hidden="true">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </span>
      <span class="theme-label">Theme</span>
    </button>
  </div>

  <form id="search-form" class="controls enter-item enter-2" autocomplete="off">
    <div class="field combo">
      <label for="uni-input">University</label>
      <input type="text" id="uni-input" placeholder="Loading universities…"
             autocomplete="off" spellcheck="false" role="combobox"
             aria-autocomplete="list" aria-expanded="false" aria-controls="uni-list"
             disabled required>
      <ul id="uni-list" class="combo-list" role="listbox"></ul>
    </div>
    <div class="field combo">
      <label for="course-input">Course</label>
      <input type="text" id="course-input" placeholder="Pick a university first"
             autocomplete="off" spellcheck="false" role="combobox"
             aria-autocomplete="list" aria-expanded="false" aria-controls="course-list"
             disabled required>
      <ul id="course-list" class="combo-list" role="listbox"></ul>
    </div>
    <div class="field compact">
      <label>&nbsp;</label>
      <button type="submit" id="go">Search</button>
    </div>
  </form>
  <div class="filter-row enter-item enter-3" aria-label="Result filters">
    <label class="term-filter-row">
      <span>Check online class offerings for:</span>
      <select id="term-filter">
        <option value="" id="term-skip-option">Skip - articulations only</option>
      </select>
    </label>
    <div class="checkbox-filter-row">
      <label><input type="checkbox" id="standalone-only"> Standalone equivalents only (hide AND bundles)</label>
      <label><input type="checkbox" id="combine-bundles" checked> Group equivalent course combinations</label>
      <label><input type="checkbox" id="async-only" disabled> Async online only</label>
    </div>
  </div>

  <div id="output"></div>
</main>
<footer>
  Data is periodically refreshed from
  <a href="https://assist.org" target="_blank" rel="noopener">ASSIST</a> and
  <a href="https://search.cvc.edu" target="_blank" rel="noopener">CVC Exchange</a>.
  Verify results with the institutions and a counselor. Not affiliated.
</footer>
<script type="module" src="script.js"></script>
</body>
</html>
