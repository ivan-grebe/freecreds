name = "freecreds-refresh"
main = "workers/refresh.ts"
compatibility_date = "2026-04-22"

# Cloudflare cron expressions are UTC.
# - CVC: roughly twice monthly.
# ASSIST refresh remains manual on the free-plan setup because a full
# articulation import writes millions of rows.
[triggers]
crons = [
  "0 9 1,15 * *"
]

[[d1_databases]]
binding = "DB"
database_name = "freecreds-db"
database_id = "9ad275b2-c398-4b03-bc62-24f32ec08398"
