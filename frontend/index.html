<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reverse ASSIST Search</title>
  <script>
    // Apply stored theme before first paint to avoid flash. If no stored
    // preference, let the media query below decide at render time.
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
  <!-- Cloudflare Web Analytics -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "a5fde3311d0e432bacc1167b67c64a08"}'></script>
  <!-- End Cloudflare Web Analytics -->
  <style>
    :root {
      --bg: #fafaf7;
      --panel: #fff;
      --ink: #1a1a1a;
      --muted: #666;
      --line: #e3e2dd;
      --accent: #2b5f3f;
      --accent-ink: #fff;
      --standalone: #2b5f3f;
      --bundle: #8a5a17;
      --warn: #7a3b3b;
      --async: #2b5f3f;
      --sync: #1e4f7a;
      --unknown: #888;

      --input-bg: #fff;
      --input-disabled-bg: #f4f3ef;
      --hover-bg: #eef4ef;
      --th-bg: #f2f1ec;
      --badge-standalone-bg: #e0ecdf;
      --badge-bundle-bg: #f3e6cd;
      --badge-async-bg: #dcebdc;
      --badge-sync-bg: #dde8f3;
      --badge-unknown-bg: #ececec;
      --error-bg: #fff3f3;
      --error-line: #f0c9c9;
      --shadow: rgba(0,0,0,.08);
    }
    /* Dark theme: applied either when the OS is in dark mode and the user
       hasn't explicitly chosen light, or when they've picked dark via the
       toggle. Explicit choice is stored on <html data-theme="..."> and
       wins over the media query. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0d0b;
        --panel: #121613;
        --ink: #efefeb;
        --muted: #a4aaa2;
        --line: #293129;
        --accent: #3f8f61;
        --accent-ink: #ffffff;
        --standalone: #78c291;
        --bundle: #d6a866;
        --warn: #e09a9a;
        --async: #78c291;
        --sync: #7fb0d8;
        --unknown: #808080;

        --input-bg: #171c18;
        --input-disabled-bg: #101310;
        --hover-bg: #1a2a20;
        --th-bg: #0f130f;
        --badge-standalone-bg: #172b20;
        --badge-bundle-bg: #3a2d1a;
        --badge-async-bg: #172b20;
        --badge-sync-bg: #142538;
        --badge-unknown-bg: #222722;
        --error-bg: #2a1515;
        --error-line: #5a2f2f;
        --shadow: rgba(0,0,0,.6);
      }
    }
    /* Explicit dark override (user clicked). Wins over light media query. */
    :root[data-theme="dark"] {
      --bg: #0b0d0b;
      --panel: #121613;
      --ink: #efefeb;
      --muted: #a4aaa2;
      --line: #293129;
      --accent: #3f8f61;
      --accent-ink: #ffffff;
      --standalone: #78c291;
      --bundle: #d6a866;
      --warn: #e09a9a;
      --async: #78c291;
      --sync: #7fb0d8;
      --unknown: #808080;

      --input-bg: #171c18;
      --input-disabled-bg: #101310;
      --hover-bg: #1a2a20;
      --th-bg: #0f130f;
      --badge-standalone-bg: #172b20;
      --badge-bundle-bg: #3a2d1a;
      --badge-async-bg: #172b20;
      --badge-sync-bg: #142538;
      --badge-unknown-bg: #222722;
      --error-bg: #2a1515;
      --error-line: #5a2f2f;
      --shadow: rgba(0,0,0,.6);
    }

    * { box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--ink); }
    body {
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 2.5rem 1rem;
      overflow-x: hidden;
    }
    main { max-width: 960px; margin: 0 auto; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
    h1 { margin: 0 0 .2rem; font-weight: 600; font-size: 1.55rem; }
    .lede { color: var(--muted); margin: 0 0 2rem; }
    .theme-toggle {
      padding: .4rem .75rem; background: transparent; color: var(--muted);
      border: 1px solid var(--line); border-radius: 6px;
      font: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer; white-space: nowrap; touch-action: manipulation;
    }
    .theme-toggle:hover { color: var(--ink); border-color: var(--muted); }
    .controls {
      display: flex; gap: .75rem; flex-wrap: wrap; align-items: end;
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      padding: 1rem; margin-bottom: 1.5rem;
    }
    .field { display: flex; flex-direction: column; gap: .25rem; min-width: 12rem; flex: 1; }
    .field label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    select, input {
      padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 6px;
      font: inherit; background: var(--input-bg); color: var(--ink);
    }
    .field.compact { min-width: 7rem; flex: 0; }
    .combo { position: relative; }
    .combo input[disabled] { background: var(--input-disabled-bg); color: var(--muted); cursor: not-allowed; }
    .combo-list {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
      max-height: calc(5 * 2.25rem + 8px);
      overflow-y: auto;
      z-index: 10; margin: 0; padding: 4px 0; list-style: none;
      box-shadow: 0 4px 14px var(--shadow);
      display: none;
    }
    .combo-list.open { display: block; }
    .combo-item {
      padding: .45rem .7rem; cursor: pointer; font-size: 14px;
      line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--ink);
    }
    .combo-item.active, .combo-item:hover { background: var(--hover-bg); }
    .combo-item .code { font-weight: 600; margin-right: .4rem; }
    .combo-item .title { color: var(--muted); }
    .combo-empty { padding: .5rem .7rem; color: var(--muted); font-size: 13px; font-style: italic; }
    .combo-count { padding: .25rem .7rem; font-size: 11px; color: var(--muted); text-transform: uppercase;
                   letter-spacing: .05em; border-bottom: 1px solid var(--line); }
    button {
      padding: .6rem 1.2rem; background: var(--accent); color: var(--accent-ink);
      border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .filter-row {
      display: grid; gap: .75rem; font-size: 13px; color: var(--muted);
      grid-template-columns: minmax(16rem, 24rem);
      align-items: center;
    }
    .filter-row label { display: inline-flex; gap: .35rem; align-items: center; }
    .term-filter-row {
      display: grid;
      grid-template-columns: max-content minmax(12rem, 1fr);
      align-items: center;
      gap: .6rem;
      max-width: 28rem;
    }
    .term-filter-row > span { white-space: nowrap; }
    .checkbox-filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem 1.25rem;
      align-items: center;
    }
    .filter-row input[type="checkbox"]:disabled + *,
    .filter-row label:has(input[type="checkbox"]:disabled) { opacity: .45; cursor: not-allowed; }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: .75rem; }
    .result-header { display: flex; justify-content: space-between; align-items: baseline; margin: 1.5rem 0 .5rem; }
    .result-header h2 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; background: var(--panel);
            border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    th, td { padding: .65rem .8rem; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: var(--th-bg); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px;
             font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
             white-space: nowrap; line-height: 1.35; }
    .badge.standalone { background: var(--badge-standalone-bg); color: var(--standalone); }
    .badge.bundle { background: var(--badge-bundle-bg); color: var(--bundle); }
    .badge.async-online { background: var(--badge-async-bg); color: var(--async); }
    .badge.online-sync { background: var(--badge-sync-bg); color: var(--sync); }
    .badge.unknown { background: var(--badge-unknown-bg); color: var(--unknown); }
    .schedule-link { font-size: 13px; color: var(--accent); text-decoration: none; white-space: nowrap; }
    .schedule-link:hover { text-decoration: underline; }
    .schedule-muted { font-size: 13px; color: var(--muted); font-style: italic; }
    .companion-list { margin: .3rem 0 0; padding-left: 1rem; font-size: 13px; color: var(--muted); }
    .receiving-companion-list { margin: .3rem 0 0; padding-left: 1rem; font-size: 13px; color: var(--accent); }
    .receiving-companion-list > li:first-child { color: var(--muted); font-style: italic; }
    .source-note { margin-top: .3rem; font-size: 11px; color: var(--muted);
                   text-transform: uppercase; letter-spacing: .04em; }
    .source-note.stale { color: var(--bundle); }
    details { margin-top: 1.5rem; background: var(--panel); border: 1px solid var(--line);
              border-radius: 8px; padding: .75rem 1rem; }
    details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
    .no-art-list { margin-top: .5rem; font-size: 13px; }
    .no-art-item { color: var(--muted); padding: .2rem 0; }
    .error { padding: 1rem; background: var(--error-bg); border: 1px solid var(--error-line); color: var(--warn);
             border-radius: 6px; }
    .suggestion-list { margin: .5rem 0 0; font-size: 13px; }
    footer { margin-top: 3rem; color: var(--muted); font-size: 12px; text-align: center; }
    footer a { color: var(--muted); }

    @media (max-width: 720px) {
      body { padding: 1.55rem .75rem 2rem; font-size: 14px; }
      main { width: 100%; }
      .page-head {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: start;
        gap: .75rem;
      }
      h1 { font-size: 1.35rem; line-height: 1.15; }
      .lede { margin-bottom: 1.1rem; font-size: 14px; }
      .theme-toggle { padding: .42rem .6rem; font-size: 12px; }

      .controls {
        display: grid;
        grid-template-columns: 1fr;
        gap: .85rem;
        padding: .85rem;
        margin-bottom: 1rem;
        margin-top: .55rem;
      }
      .field,
      .field.compact {
        min-width: 0;
        width: 100%;
        flex: none;
      }
      .field.compact label { display: none; }
      select,
      input:not([type="checkbox"]),
      button {
        width: 100%;
        min-height: 44px;
        font-size: 16px;
      }
      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        min-width: 18px;
        margin-top: .1rem;
      }
      .combo-list {
        max-height: min(18rem, 48vh);
        border-radius: 8px;
      }
      .combo-item {
        padding: .65rem .75rem;
        white-space: normal;
      }
      .combo-item .code,
      .combo-item .title {
        display: block;
      }
      .combo-item .title {
        margin-top: .1rem;
      }
      .filter-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: .65rem;
        padding: .8rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 1rem;
      }
      .filter-row label,
      .term-filter-row {
        width: 100%;
        align-items: flex-start;
      }
      .term-filter-row {
        grid-template-columns: 1fr;
        max-width: none;
        gap: .35rem;
      }
      .term-filter-row > span { white-space: normal; }
      .checkbox-filter-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: .65rem;
      }
      .filter-row select {
        margin-top: 0;
        min-width: 0;
        font-size: 16px;
      }
      .result-header {
        display: block;
        margin-top: 1.2rem;
      }
      .result-header h2 {
        font-size: 1rem;
        line-height: 1.25;
      }
      .meta { font-size: 12px; overflow-wrap: anywhere; }

      table,
      thead,
      tbody,
      tr,
      td {
        display: block;
        width: 100%;
      }
      table {
        background: transparent;
        border: 0;
        border-radius: 0;
      }
      thead { display: none; }
      tbody {
        display: grid;
        gap: .75rem;
      }
      tr {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: .75rem;
        box-shadow: 0 1px 8px var(--shadow);
      }
      td {
        border: 0;
        padding: .55rem 0;
        overflow-wrap: anywhere;
      }
      td + td {
        border-top: 1px solid var(--line);
      }
      td::before {
        content: attr(data-label);
        display: block;
        margin-bottom: .2rem;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .05em;
        text-transform: uppercase;
      }
      .badge {
        border-radius: 999px;
      }
      .schedule-link,
      .schedule-muted {
        display: inline-flex;
        min-height: 32px;
        align-items: center;
      }
      .companion-list,
      .receiving-companion-list {
        padding-left: 1.1rem;
      }
      details {
        padding: .75rem;
      }
      footer {
        margin-top: 2rem;
        padding: 0 .5rem;
      }
    }

    @media (max-width: 390px) {
      body { padding-left: .6rem; padding-right: .6rem; }
      .page-head { grid-template-columns: 1fr; }
      .theme-toggle { width: auto; justify-self: start; }
    }
  </style>
</head>
<body>
<main>
  <div class="page-head">
    <div>
      <h1>Reverse ASSIST Search</h1>
      <p class="lede">Pick a California university and a course, see every California community college that articulates to it.</p>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">Theme</button>
  </div>

  <form id="search-form" class="controls" autocomplete="off">
    <div class="field combo">
      <label for="uni-input">University</label>
      <input type="text" id="uni-input" placeholder="Loading universities…"
             autocomplete="off" spellcheck="false" role="combobox"
             aria-autocomplete="list" aria-expanded="false" aria-controls="uni-list"
             disabled required>
      <ul id="uni-list" class="combo-list" role="listbox"></ul>
    </div>
    <div class="field combo">
      <label for="course-input">Course</label>
      <input type="text" id="course-input" placeholder="Pick a university first"
             autocomplete="off" spellcheck="false" role="combobox"
             aria-autocomplete="list" aria-expanded="false" aria-controls="course-list"
             disabled required>
      <ul id="course-list" class="combo-list" role="listbox"></ul>
    </div>
    <div class="field compact">
      <label>&nbsp;</label>
      <button type="submit" id="go">Search</button>
    </div>
  </form>
  <div class="filter-row" aria-label="Result filters">
    <label class="term-filter-row">
      <span>Check online class offerings for:</span>
      <select id="term-filter">
        <option value="" id="term-skip-option">Skip - articulations only</option>
      </select>
    </label>
    <div class="checkbox-filter-row">
      <label><input type="checkbox" id="standalone-only"> Standalone equivalents only (hide AND bundles)</label>
      <label><input type="checkbox" id="combine-bundles" checked> Combine duplicate AND bundles</label>
      <label><input type="checkbox" id="async-only" disabled> Async online only</label>
    </div>
  </div>

  <div id="output"></div>
</main>
<footer>
  Data sourced live from <a href="https://assist.org" target="_blank" rel="noopener">assist.org</a>. Not affiliated.
</footer>
<script src="script.js"></script>
</body>
</html>
