<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reverse ASSIST Search</title>
  <style>
    :root {
      --bg: #fafaf7;
      --panel: #fff;
      --ink: #1a1a1a;
      --muted: #666;
      --line: #e3e2dd;
      --accent: #2b5f3f;
      --standalone: #2b5f3f;
      --bundle: #8a5a17;
      --warn: #7a3b3b;
    }
    * { box-sizing: border-box; }
    body {
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 2.5rem 1rem; background: var(--bg); color: var(--ink);
    }
    main { max-width: 960px; margin: 0 auto; }
    h1 { margin: 0 0 .2rem; font-weight: 600; font-size: 1.55rem; }
    .lede { color: var(--muted); margin: 0 0 2rem; }
    .controls {
      display: flex; gap: .75rem; flex-wrap: wrap; align-items: end;
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      padding: 1rem; margin-bottom: 1.5rem;
    }
    .field { display: flex; flex-direction: column; gap: .25rem; min-width: 12rem; flex: 1; }
    .field label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    select, input {
      padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 6px;
      font: inherit; background: #fff;
    }
    .field.compact { min-width: 7rem; flex: 0; }
    button {
      padding: .6rem 1.2rem; background: var(--accent); color: #fff;
      border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .filter-row { display: flex; gap: 1rem; font-size: 13px; color: var(--muted); }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: .75rem; }
    .result-header { display: flex; justify-content: space-between; align-items: baseline; margin: 1.5rem 0 .5rem; }
    .result-header h2 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; background: var(--panel);
            border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    th, td { padding: .65rem .8rem; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: #f2f1ec; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px;
             font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
    .badge.standalone { background: #e0ecdf; color: var(--standalone); }
    .badge.bundle { background: #f3e6cd; color: var(--bundle); }
    .companion-list { margin: .3rem 0 0; padding-left: 1rem; font-size: 13px; color: var(--muted); }
    details { margin-top: 1.5rem; background: var(--panel); border: 1px solid var(--line);
              border-radius: 8px; padding: .75rem 1rem; }
    details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
    .no-art-list { margin-top: .5rem; font-size: 13px; }
    .no-art-item { color: var(--muted); padding: .2rem 0; }
    .error { padding: 1rem; background: #fff3f3; border: 1px solid #f0c9c9; color: var(--warn);
             border-radius: 6px; }
    .suggestion-list { margin: .5rem 0 0; font-size: 13px; }
    footer { margin-top: 3rem; color: var(--muted); font-size: 12px; text-align: center; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Reverse ASSIST Search</h1>
  <p class="lede">Pick a university and a course. See every California community college that articulates to it.</p>

  <form id="search-form" class="controls" autocomplete="off">
    <div class="field">
      <label for="uni">University</label>
      <select id="uni" required></select>
    </div>
    <div class="field">
      <label for="course">Course</label>
      <select id="course" required disabled>
        <option value="">&mdash; loading &mdash;</option>
      </select>
    </div>
    <div class="field compact">
      <label>&nbsp;</label>
      <button type="submit" id="go">Search</button>
    </div>
  </form>
  <div class="filter-row">
    <label><input type="checkbox" id="standalone-only"> Standalone equivalents only (hide AND bundles)</label>
  </div>

  <div id="output"></div>
</main>
<footer>
  Data sourced live from <a href="https://assist.org" target="_blank" rel="noopener">assist.org</a>. Not affiliated.
</footer>
<script src="script.js"></script>
</body>
</html>
