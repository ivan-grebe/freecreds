[project]
name = "freecreds"
version = "0.1.0"
description = "Search California course articulations and online class offerings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
