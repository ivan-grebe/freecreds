[project]
name = "freecreds"
version = "0.1.0"
description = "Search California course articulations and online class offerings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
# Ruff is bounded on purpose: an unpinned upgrade widened the default rule set
# and broke CI on unchanged code.
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.16,<0.17"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
  # Term windows are academic calendar dates, so the local date is intended.
  # Attaching a timezone here would shift term boundaries.
  "DTZ011",
  # Bulk ingestion deliberately isolates per-record failures: roll back, log,
  # and continue instead of aborting an entire import.
  "BLE001",
  # `__enter__` already returns self; typing.Self needs 3.11 and this targets 3.10.
  "PYI034",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
